# The grammar of every data/ and meta/ file, checked by builder/schema.py
# before the build normalizes anything. A field name ending in "!" is
# required; a field not listed here is an error. Types:
#   str, text (markdown allowed), name (plain, no markdown link), int,
#   bool, url, date (2025, 2025-06, 2025-06-01, 2025-06-01 10:00),
#   dates (2022-09-12/2025-01-10, open end 2023-02/..), years (2022/2023),
#   term (2024-spring), apa ("Surname, X. Y."), any
#   key:<pool>  a key of authors, venues, courses, institutions, projects, papers,
#               positions (entry ids) or coursework_groups (bio.yaml)
#   enum:a,b    list:<spec>    record:<name>    <spec>|<spec>
#   {map: <spec>, keys: <spec>}  a mapping with free keys
#   {one_of: [<spec>, ...]}      either form, when a form itself has "|"
# Naming: field names snake_case, pool keys lowercase kebab-case, entry
# ids uni__unit__role (eth__siplab__holz, metu__ceng__msc).

files:
  data/bio.yaml: record:bio
  data/education.yaml: {"education!": "list:record:education"}
  data/experience.yaml: {"experience!": "list:record:position"}
  data/research.yaml: {"research!": "list:record:position"}
  data/teaching.yaml: {"teaching!": "list:record:teaching"}
  data/extracurricular.yaml: record:extracurricular
  data/publications.yaml: {"proper_nouns": "list:str", "papers!": "list:record:paper"}
  data/blogs.yaml: record:blogs
  data/works.yaml: {"works!": "list:record:work"}
  data/social_posts.yaml: {"posts!": "list:record:post"}
  meta/authors.yaml: {"authors!": {map: record:author}}
  meta/venues.yaml: {"venues!": {map: record:venue}}
  meta/courses.yaml: {"courses!": {map: record:course}}
  meta/institutions.yaml: {"institutions!": {map: record:institution}}
  meta/projects.yaml: {"projects!": {map: record:project}}

records:
  # --- shared pieces
  news_item: {"date!": date, "text!": text}
  link: {"name!": "enum:DOI,ISBN,arXiv,PDF,Thesis,Code,Data", "url!": url}
  linked_name: {"name!": name, "url!": url}
  award:
    "name!": name
    org: key:institutions
    organization: name
    date: date|years
    show: list:enum:resume,timeline
    url: url
    logo: url
    description: text

  # --- data/bio.yaml
  bio:
    "name!": name
    "title!": name
    profile_image: url
    site_url: url
    affiliations:
      list:
        "org!": key:institutions
        detail: {"text!": str, url: url}
        phone: str
    location: str
    timezone: str
    meta_description: str
    appointment_url: url
    show_metrics: bool
    metrics: {map: {map: int}}
    short_bio: text
    research_interests: text
    research_keywords: {map: list:str, keys: key:coursework_groups}
    coursework_groups: {map: {"title!": name, "resume!": name}}
    bio: text
    social: {map: str}
    custom_links: list:record:linked_name

  # --- entries: education, experience, research, teaching
  education:
    "id!": str
    "data!":
      "degree!": name
      "org!": key:institutions
      advisors: list:key:authors
      co_advisors: list:key:authors
      "dates!": dates
      thesis: key:papers|record:inline_thesis
      coursework: {map: list:key:courses, keys: key:coursework_groups}
    "show!": list:enum:timeline
    news: list:record:news_item
    description: text
    bullets: list:text
    awards: list:record:award
    links: list:record:link
  inline_thesis: {label: name, "title!": name, url: url}
  position:
    "id!": str
    "data!":
      "position!": name
      "org!": key:institutions
      advisors: list:key:authors
      co_advisors: list:key:authors
      "dates!": dates
      load: enum:full-time
      hours: int
      remote: bool
      course: key:courses
      project: key:projects
    "show!": list:enum:timeline
    news: list:record:news_item
    description: text
    bullets: list:text
    awards: list:record:award
    links: list:record:link
  teaching:
    "id!": str
    "data!": {"position!": name, "org!": key:institutions, hours: int}
    "show!": list:enum:timeline
    description: text
    "courses!": list:record:taught
  taught: {"course!": key:courses, "terms!": list:term}

  # --- data/extracurricular.yaml
  extracurricular:
    honors: list:record:award
    languages: list:record:spoken
    skills: {map: {"title!": name, "items!": list:name|record:linked_name}}

  spoken: {"name!": name, "level!": str}

  # --- data/publications.yaml
  paper:
    "id!": str
    "kind!": enum:article,proceedings,chapter,thesis
    stage: enum:published,preprint,submitted
    target: key:venues
    "data!":
      "title!": name
      short_title: name
      topic: str
      "authors!": list:key:authors|apa
      venue: key:venues|record:venue_ref
      "date!": date
    selected: bool
    "show!": list:enum:front,resume,timeline
    source: key:positions
    image: url
    news: {one_of: [bool, "list:record:news_item|record:news_event"]}
    links: list:record:link
    awards: list:record:paper_award
    body: text
  # news: true generates one item from the stage (published: accepted at
  # **<venue short> <year>** in <city>, linking arXiv, DOI or PDF;
  # preprint: is on arXiv; submitted: nothing). A list mixes free items
  # {date, text} with generated ones; `where` overrides the venue's city
  # for that year, `topic` adds " on <topic>" after the linked short_title.
  news_event: {"date!": date, "event!": "enum:accepted,preprint", where: name, topic: str}
  venue_ref: {id: key:venues, name: name, volume: str, detail: str, prefix: str, short: name, url: url}
  paper_award: {"name!": name, "organization!": name, url: url, logo: url, description: text}

  # --- data/blogs.yaml, works.yaml, social_posts.yaml
  blogs:
    tag_tree: {map: list:str}
    "blogs!": list:record:blog
  blog: {"title!": name, "date!": date, description: text, path: str, tags: list:str, selected: bool}
  work: {"id!": str, "title!": name, description: text, url: url, tags: list:str, body: text}
  post: {"platform!": "enum:linkedin,twitter,x", "url!": url, "title!": name, excerpt: text, image: url}

  # --- meta/ pools
  author: {"apa!": apa, "name!": name, title: name, site: url, scholar: url, github: url}
  venue:
    "name!": name
    short: name
    short_year: bool
    url: url
    double_blind: bool
    selected: bool
    cities: {map: name, keys: int}
  course: {"code!": name, name: name, url: url}
  project:
    "name!": name
    "short!": name
    "title!": name
    funder: record:linked_name
    url: url
    logo: url
  institution:
    "name!": name
    short: name
    url: url
    parent: key:institutions
    location: str
    logo: url
